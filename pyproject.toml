[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smtts"
version = "1.9.0"
description = "Synthetic MT TimeSeries (SMTTS) Python edition: synthesize Phoenix-format MT/AMT time series from XMLSITE forward models - single algorithm, built-in calibration, coherently-paired multi-site batches"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Wang Peijie"},
    {name = "Chen Xuan"},
    {name = "Zhang Yong"}
]
keywords = ["smtts", "magnetotelluric", "mt", "amt", "time-series", "synthesis", "phoenix", "remote-reference", "geophysics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/EMWPJ/Synthetic-MT-Python"
Paper = "https://www.frontiersin.org/articles/10.3389/feart.2023.1086749"

[project.scripts]
synthts = "synthts.cli:main"

[tool.setuptools]
packages = ["synthts"]

[tool.setuptools.package-data]
synthts = ["assets/*", "assets/AMT/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running end-to-end tests (select with -m slow)",
]
